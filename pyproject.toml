[project]
name = "ops-agent-mcp"
version = "0.2.0"
description = "Ticket-triage and internal-docs agent for a fictional client (Northwind Logistics), built on a custom MCP server with human-in-the-loop approvals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ops-agent = "ops_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ops_agent"]
mypy_path = "src"

[tool.ruff.lint.per-file-ignores]
# Synthetic-data catalogues: long natural-language string literals are clearer unwrapped.
"src/ops_agent/seed/catalog.py" = ["E501"]
"src/ops_agent/seed/corpus.py" = ["E501"]
